spring:
  application:
    name: plant-care-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/plant-care;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 6MB
  flyway:
    enabled: true

app:
  password: ${GARDEN_PASSWORD:}
  photo-directory: ${PHOTO_DIRECTORY:./data/photos}
  identify-url: ${IDENTIFY_URL:http://127.0.0.1:8765/identify}
  # Empty keeps the private MCP endpoint unavailable. Do not reuse another service's credential.
  mcp:
    bearer-token: ${MCP_BEARER_TOKEN:}
    owner-username: ${MCP_OWNER_USERNAME:gardener}
  version: ${APP_VERSION:0.1.0-SNAPSHOT}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        secure: ${SECURE_COOKIES:false}
  port: ${SERVER_PORT:8080}
