name: Android development APK
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/api/src/main/resources/static/**'
      - 'tests/mobile-assets.test.mjs'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - run: npm ci --ignore-scripts
        working-directory: apps/mobile
      - run: node --test tests/mobile-assets.test.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:mobile-shell
      - run: npm run apk:debug
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: little-garden-android-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
