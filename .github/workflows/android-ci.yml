name: Android development APK
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/api/src/main/resources/static/**'
      - 'tests/mobile-assets.test.mjs'
      - 'tests/mobile-shell-smoke.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require preinstalled Android SDK packages
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - run: npm ci --ignore-scripts
        working-directory: apps/mobile
      - run: node --test tests/mobile-assets.test.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:mobile-shell
      - run: npm test
      - name: Synthetic native HTTPS transport tests
        run: apps/api/gradlew -p apps/mobile/transport-tests test --no-daemon
      - run: node apps/mobile/scripts/build-web.mjs --startup-test
      - run: node tests/mobile-startup-diagnostic-smoke.cjs
      - run: npm run apk:startup-test
        working-directory: apps/mobile
      - run: ./gradlew testDebugUnitTest
        working-directory: apps/mobile/android
      - name: Verify isolated test identity, assets and public signer
        shell: bash
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/startupTest/app-startupTest.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/startup-test-badging.txt
          grep -F "package: name='com.eternalliquet.littlegarden.startuptest'" /tmp/startup-test-badging.txt
          grep -F "application-label:'Little Garden Test'" /tmp/startup-test-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"
          unzip -p "$APK" assets/public/native-shell.js | grep -F 'PR28 baseline 9e5c698'
          unzip -p "$APK" assets/capacitor.plugins.json
      - uses: actions/upload-artifact@v4
        with:
          name: little-garden-startup-test-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/startupTest/app-startupTest.apk
          if-no-files-found: error
          retention-days: 7
