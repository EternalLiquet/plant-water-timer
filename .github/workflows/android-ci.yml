name: Android development APK
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/api/src/main/resources/static/**'
      - 'tests/mobile-assets.test.mjs'
      - 'tests/mobile-shell-smoke.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require preinstalled Android SDK packages
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - run: npm ci --ignore-scripts
        working-directory: apps/mobile
      - run: node --test tests/mobile-assets.test.mjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:mobile-shell
      - run: npm test
      - name: Synthetic native HTTPS transport tests
        run: apps/api/gradlew -p apps/mobile/transport-tests test --no-daemon
      - run: npm run apk:debug
        working-directory: apps/mobile
      - run: ./gradlew testDebugUnitTest :app:assembleDebugAndroidTest
        working-directory: apps/mobile/android
      - name: Record public APK signing certificate and packaged SQLite plugin
        shell: bash
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          unzip -p "$APK" assets/capacitor.plugins.json
          if test -d "$ANDROID_HOME/system-images"; then
            find "$ANDROID_HOME/system-images" -name system.img -print
          else
            echo 'No preinstalled emulator system images; instrumentation compiled only.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: little-garden-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
