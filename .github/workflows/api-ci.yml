name: MVP checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test build
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --check apps/api/src/main/resources/static/app.js
  identification-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/identify/requirements-test.lock
      - run: pip install -r apps/identify/requirements-test.lock
      - run: python -m unittest discover -s apps/identify -p 'test_*.py'
      - run: python -m compileall -q apps/identify
  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: ./gradlew --no-daemon bootJar
        working-directory: apps/api
      - name: Mobile browser journey with synthetic identification boundary
        shell: bash
        run: |
          python3 tests/identification-stub.py & MODEL=$!
          GARDEN_PASSWORD=synthetic-garden-test-2026 DATABASE_URL='jdbc:h2:file:./build/browser-garden;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH' PHOTO_DIRECTORY=./build/browser-photos java -jar apps/api/build/libs/plant-care-api-0.1.0-SNAPSHOT.jar > /tmp/garden-browser.log 2>&1 & APP=$!
          trap 'kill "$APP" "$MODEL" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/api/session >/dev/null && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-screenshots
          path: test-artifacts/
          retention-days: 7
